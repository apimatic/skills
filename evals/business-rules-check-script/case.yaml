schema_version: "1.1"
name: business-rules-check-script
description: >-
  apimatic-business-rules runs its bundled scripts/rules.mjs from wherever the plugin is installed (the skill names it
  through <skill-dir>), on a copy of the skill's example project. Needs --scaffold --allow-tools Bash, on Linux, macOS or WSL2.
tags: [shell, business-rules]
expected_outcome: The agent runs `node <plugin>/skills/apimatic-business-rules/scripts/rules.mjs check`, which prints OK.
context:
  scaffold_script: fixture.sh
execution:
  max_turns: 25
  timeout_seconds: 600
  allowed_tools: [Read, Glob, Grep, Skill]
  prompt: >-
    This directory is an APIMatic project whose business rules are already written to src/rules/. Run the business
    rules check on it and tell me whether it passes. Only run the check: don't change any files.
graders:
  - name: ran-bundled-check
    type: tool_used
    tool: Bash
    input_match: 'apimatic-business-rules[\/]+scripts[\/]+rules\.mjs"?\s+check'
  - name: reports-pass
    type: llm
    criteria: |
      PASS if the response reports that the business rules check passed (the check printed OK, with no errors).

      FAIL if it reports that the check script could not be found or run, that the check failed, or if it changed
      files in src/rules/ or rules-work/.
